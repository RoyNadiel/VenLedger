<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#18181b" />
    <meta name="description" content="VenLedger - Control financiero personal y deudas en Venezuela" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- Preload de Fuentes Locales -->
    <link rel="preload" href="/src/assets/fonts/Bellota-Regular.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/src/assets/fonts/Bellota-Bold.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/src/assets/fonts/Inconsolata-Regular.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/src/assets/fonts/Inconsolata-Bold.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/src/assets/fonts/MontserratAlternates-SemiBold.woff2" as="font" type="font/woff2" crossorigin />

    <title>VenLedger - Finance PWA</title>
  </head>
  <body>
    <script>
      (function() {
        const savedTheme = localStorage.getItem('theme');
        if (savedTheme === 'dark' || (!savedTheme && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
          document.documentElement.classList.add('dark');
        } else {
          document.documentElement.classList.remove('dark');
        }
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
